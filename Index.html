<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decálogo ético profesional</title><style>
:root{--navy:#123b5d;--teal:#007e87;--pink:#d73c7c;--gold:#e8a317;--bg:#eef5f7;--text:#1b2b38;--muted:#60717d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#edf5f7,#fff);color:var(--text)}header{background:linear-gradient(120deg,var(--navy),#09243a);color:#fff;padding:56px 7vw 44px;position:relative;overflow:hidden}header:after{content:"10";position:absolute;right:7vw;top:5px;font-size:170px;font-weight:800;color:#ffffff10}h1{font-size:clamp(34px,6vw,68px);margin:0 0 10px}.sub{font-size:18px;color:#c9e1e8;max-width:750px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:22px 7vw;background:#fff;position:sticky;top:0;z-index:3;box-shadow:0 4px 18px #0b223318}.toolbar button{border:0;padding:10px 16px;border-radius:999px;background:#e8f1f3;color:var(--navy);font-weight:700;cursor:pointer}.toolbar button.active{background:var(--navy);color:#fff}.grid{padding:30px 7vw 70px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 10px 30px #123b5d14;border-top:6px solid var(--c);transition:.25s;cursor:pointer}.card:hover{transform:translateY(-5px);box-shadow:0 16px 36px #123b5d22}.tag{color:var(--c);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px}.num{float:right;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:800}.card h2{font-size:21px;color:var(--navy);margin:21px 0 10px}.card p{line-height:1.5;color:var(--muted);margin:0}.detail{max-height:0;overflow:hidden;transition:.3s;color:var(--text)!important}.card.open .detail{max-height:140px;margin-top:15px;padding-top:15px;border-top:1px solid #dce7eb}footer{background:var(--navy);color:#d6e5eb;text-align:center;padding:24px}@media print{.toolbar{display:none}.card{break-inside:avoid}.grid{grid-template-columns:1fr 1fr}header{padding:30px}.card:hover{transform:none}}
</style></head><body><header><div class="tag" style="color:#4fd3d9">UVEG · Ética y Responsabilidad Social</div><h1>Decálogo ético profesional</h1><div class="sub">Diez compromisos para orientar mis decisiones personales, sociales y profesionales con integridad, respeto y responsabilidad.</div></header><nav class="toolbar"><button class="active" data-f="all">Todos</button><button data-f="Personal">Ética personal</button><button data-f="Social">Ética social</button><button data-f="Profesional">Ética profesional</button></nav><main class="grid" id="grid"></main><footer>Daniel Cueto Meza · Matrícula 24014911 · Septiembre 2026</footer><script>
const data=[['Personal','Integridad','Actuaré de manera congruente con mis valores, incluso cuando nadie esté observando.','La integridad conecta mis palabras, decisiones y acciones.'],['Personal','Responsabilidad','Cumpliré mis compromisos y asumiré las consecuencias de mis decisiones y omisiones.','Responder por mis actos fortalece la confianza.'],['Personal','Aprendizaje continuo','Reconoceré mis límites, corregiré errores y mantendré una actitud permanente de mejora.','Aprender también implica escuchar y rectificar.'],['Social','Respeto a la dignidad','Trataré a cada persona con consideración, sin humillaciones, prejuicios ni discriminación.','Toda persona merece un trato respetuoso.'],['Social','Justicia y equidad','Promoveré oportunidades justas y decisiones basadas en criterios objetivos y transparentes.','La equidad reconoce barreras y busca corregirlas.'],['Social','Solidaridad','Contribuiré al bienestar común, escucharé otras perspectivas y apoyaré soluciones colaborativas.','La colaboración convierte valores en acciones colectivas.'],['Profesional','Competencia profesional','Realizaré mi trabajo con preparación, diligencia, calidad y apego a prácticas responsables.','La calidad exige preparación y actualización constante.'],['Profesional','Confidencialidad y protección de datos','Protegeré la información personal, comercial y organizacional, utilizándola solamente para fines autorizados.','La confianza depende del uso legítimo y seguro de la información.'],['Profesional','Transparencia y conflictos de interés','Comunicaré información veraz y declararé cualquier interés que pueda afectar mi objetividad.','La transparencia permite decisiones informadas y verificables.'],['Profesional','Uso responsable de la tecnología','Usaré datos y herramientas digitales con seguridad, criterio humano y respeto por los derechos de las personas.','La innovación debe estar acompañada de responsabilidad.']];const colors={Personal:'#007e87',Social:'#d73c7c',Profesional:'#e8a317'};const grid=document.getElementById('grid');function draw(f='all'){grid.innerHTML='';data.filter(x=>f==='all'||x[0]===f).forEach((x,i)=>{let n=data.indexOf(x)+1;let el=document.createElement('article');el.className='card';el.style.setProperty('--c',colors[x[0]]);el.innerHTML=`<span class="num">${n}</span><div class="tag">Ética ${x[0].toLowerCase()}</div><h2>${x[1]}</h2><p>${x[2]}</p><p class="detail">${x[3]}</p>`;el.onclick=()=>el.classList.toggle('open');grid.appendChild(el)})}draw();document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.f)})
</script></body></html>
